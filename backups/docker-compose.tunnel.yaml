# Optional hardened variant: no public route on the server at all.
# Traffic arrives only through a Cloudflare Tunnel, guarded by Cloudflare Access
# (see README.md). Do NOT give the `app` service a domain in Coolify.
#
# Set manually: PUBLIC_URL (e.g. https://backups.example.com), TUNNEL_TOKEN, ADMIN_EMAIL, ADMIN_PASSWORD.

services:
  app:
    image: ghcr.io/flyingwebie/convex-backup-console:${CONSOLE_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    environment:
      - PUBLIC_URL=${PUBLIC_URL}
      - BACKUP_MASTER_KEY=${SERVICE_PASSWORD_64_MASTERKEY}
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_AUTHSECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - console-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

volumes:
  console-data:
