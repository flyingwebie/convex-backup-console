# Fly.io config. From app/: fly launch --copy-config --no-deploy
# then set the secrets (docs/deploy.md#flyio) and run `fly deploy --ha=false` (one machine: SQLite + scheduler).
app = "convex-backup-console"   # must be globally unique — change it
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[[mounts]]
  source = "cbc_data"
  destination = "/data"
  initial_size = "5gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Scheduled backups and alerts run inside the app, so it must never be stopped.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
